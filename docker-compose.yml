services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    hostname: api-gateway-service
    environment:
      # Auth settings
      - JWT_SECRET=${JWT_SECRET}
      - API_VALIDATION_URL=${API_VALIDATION_URL}
      # Config paths
      - CONFIG_PATH=/app/configs/config.yaml
      - ROUTES_PATH=/app/configs/routes.yaml
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENV=production
      - VERSION=0.0.1
      - TRACING_ENDPOINT=http://jaeger:14268/api/traces
    volumes:
      - ./configs:/app/configs
    restart: unless-stopped
    networks:
      - shared_net

networks:
  shared_net:
    external: true
