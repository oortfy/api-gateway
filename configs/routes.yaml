routes:
  - path: "/auth/*"
    upstream: "http://auth-service:8000"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 60  # Auth operations should be fast
    middlewares:
      require_auth: false
      rate_limit:
        requests: 10000  # High throughput for auth
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 10    # Higher threshold for high traffic
        timeout: 60
        max_concurrent: 500  # Much higher concurrency
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  - path: "/scanjobmanager/*"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 900
    middlewares:
      require_auth: true
      rate_limit:
        requests: 5000  # High throughput for general operations
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 10
        timeout: 60
        max_concurrent: 200
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  - path: "/project/*"
    upstream: "http://projects-service:8002"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 900
    middlewares:
      require_auth: true
      rate_limit:
        requests: 5000
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 10
        timeout: 60
        max_concurrent: 200
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  # gRPC to gRPC proxy example with enterprise settings
  - path: "com.example.service.UserService/*"
    protocol: "GRPC"
    endpoints_protocol: "GRPC"
    rpc_server: "/api/users"
    upstream: "grpc://user-service:50051"
    timeout: 120
    compression: true
    load_balancing:
      method: "round_robin"
      health_check: true
      driver: "static"
      endpoints:
        - "grpc://user-service-1:50051"
        - "grpc://user-service-2:50051"
        - "grpc://user-service-3:50051"  # More endpoints
        - "grpc://user-service-4:50051"
      health_check_config:
        interval: 5    # More frequent health checks
        timeout: 2
    middlewares:
      require_auth: true
      circuit_breaker:
        enabled: true
        threshold: 15  # Higher for enterprise
        timeout: 60
        max_concurrent: 500
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 30
        retry_on: ["unavailable", "deadline_exceeded"]
    
  # gRPC with etcd service discovery - enterprise configuration
  - path: "com.example.service.ProductService/*"
    protocol: "GRPC"
    endpoints_protocol: "GRPC"
    rpc_server: "/api/products"
    upstream: "grpc://product-service:50051"
    timeout: 180
    compression: true
    load_balancing:
      method: "round_robin"
      health_check: true
      driver: "etcd"
      discoveries:
        name: "product-service"
        prefix: "services"
        fail_limit: 2  # Lower fail limit for faster recovery
      health_check_config:
        interval: 5
        timeout: 2
    middlewares:
      require_auth: true
      rate_limit:
        requests: 5000
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 15
        timeout: 60
        max_concurrent: 300
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 45
        retry_on: ["unavailable", "deadline_exceeded"]

  - path: "/scanjobmanager/docker-credentials"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["POST", "GET", "PUT"]
    protocol: HTTP
    strip_prefix: false
    timeout: 900  # 15 minutes
    middlewares:
      require_auth: true
      rate_limit:
        requests: 100   # Reasonable limit for expensive operations
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 5
        timeout: 120    # Longer recovery for expensive ops
        max_concurrent: 20
      retry_policy:
        enabled: false  # No retries for long operations

  # Long-running scan operations
  - path: "/scanjobmanager/scan/*"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["POST", "GET", "PUT"]
    protocol: HTTP
    strip_prefix: false
    timeout: 1200  # 20 minutes
    middlewares:
      require_auth: true
      rate_limit:
        requests: 50
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 3
        timeout: 180
        max_concurrent: 10
      retry_policy:
        enabled: false
