routes:
  - path: "/auth/*"
    upstream: "http://auth-service:8000"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 30
    middlewares:
      require_auth: false
      rate_limit:
        requests: 100000
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 5
        timeout: 30
        max_concurrent: 100
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  - path: "/scanjobmanager/*"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 900
    middlewares:
      require_auth: true
      rate_limit:
        requests: 100000
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 5
        timeout: 30
        max_concurrent: 100
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  - path: "/project/*"
    upstream: "http://projects-service:8002"
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    protocol: HTTP
    strip_prefix: false
    timeout: 30
    middlewares:
      require_auth: true
      rate_limit:
        requests: 100000
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 5
        timeout: 30
        max_concurrent: 100
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["connection_error", "server_error"]

  # gRPC to gRPC proxy example
  - path: "com.example.service.UserService/*"
    protocol: "GRPC"
    endpoints_protocol: "GRPC"
    rpc_server: "/api/users"
    upstream: "grpc://user-service:50051"
    timeout: 30
    compression: true
    load_balancing:
      method: "round_robin"
      health_check: true
      driver: "static"
      endpoints:
        - "grpc://user-service-1:50051"
        - "grpc://user-service-2:50051"
      health_check_config:
        interval: 10
        timeout: 2
    middlewares:
      require_auth: true
      circuit_breaker:
        enabled: true
        threshold: 5
        timeout: 30
        max_concurrent: 100
      retry_policy:
        enabled: true
        attempts: 2
        per_try_timeout: 20
        retry_on: ["unavailable", "deadline_exceeded"]
    
  # Another gRPC to gRPC example with etcd service discovery
  - path: "com.example.service.ProductService/*"
    protocol: "GRPC"
    endpoints_protocol: "GRPC"
    rpc_server: "/api/products"
    upstream: "grpc://product-service:50051" # Fallback if service discovery fails
    timeout: 60
    compression: true
    load_balancing:
      method: "round_robin"
      health_check: true
      driver: "etcd"
      discoveries:
        name: "product-service"
        prefix: "services"
        fail_limit: 3
      health_check_config:
        interval: 15
        timeout: 3
    middlewares:
      require_auth: true
      rate_limit:
        requests: 1000
        period: "minute"

  - path: "/scanjobmanager/docker-credentials"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["POST", "GET", "PUT"]
    protocol: HTTP
    strip_prefix: false
    timeout: 900  # 15 minutes
    middlewares:
      require_auth: true
      rate_limit:
        requests: 10
        period: "minute"  # Lower rate limit for expensive operations
      circuit_breaker:
        enabled: true
        threshold: 3  # Lower threshold since these are expensive
        timeout: 60   # Longer recovery time
        max_concurrent: 5  # Lower concurrency limit
      retry_policy:
        enabled: false  # Disable retries for long operations

  # Long-running scan operations
  - path: "/scanjobmanager/scan/*"
    upstream: "http://scanjobmanager-service:8001"
    methods: ["POST", "GET", "PUT"]
    protocol: HTTP
    strip_prefix: false
    timeout: 1200  # 20 minutes
    middlewares:
      require_auth: true
      rate_limit:
        requests: 5
        period: "minute"
      circuit_breaker:
        enabled: true
        threshold: 2
        timeout: 120
        max_concurrent: 3
      retry_policy:
        enabled: false
